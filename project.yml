name: SayVoice
options:
  bundleIdPrefix: com.sayvoice
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  CWhisper:
    path: Packages/CWhisper

targets:
  SayVoice:
    type: application
    platform: macOS
    sources:
      - path: SayVoice
        excludes:
          - Resources/Info.plist
          - Resources/Fonts
      # Folder reference: copied into Contents/Resources/Fonts as a folder,
      # which is what ATSApplicationFontsPath in Info.plist points at.
      - path: SayVoice/Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: CWhisper
        product: WhisperSwift
    scheme:
      testTargets:
        - SayVoiceTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sayvoice.app
        PRODUCT_NAME: SayVoice
        INFOPLIST_FILE: SayVoice/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SayVoice/Resources/SayVoice.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true

  SayVoiceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SayVoiceTests
    dependencies:
      - target: SayVoice
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        # The bundle carries no resources of its own, so let Xcode synthesise
        # its Info.plist instead of checking an empty one into the repo.
        GENERATE_INFOPLIST_FILE: true
